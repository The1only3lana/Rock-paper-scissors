<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="overlay">
        <div id="instructionsBox">
            <h2>How to Play</h2>
            <p>Choose Rock, Paper, or Scissors. First to 5 points wins the match!</p>
            <button id="continueBtn">Continue</button>
        </div>
    </div>

        <h1>Rock Paper Scissors</h1>
            <div id="intro">
                <p>Welcome to the classic game of Rock, Paper, Scissors! Click the button below to start playing against the computer.</p>
                <button id="startGame">Start Game</button>
            </div> <br><br>
    
    <div id="countdown"font-size:60px; margin-top:20px;>3</div>

            <div class="game blurred">
                <div class="container">
                    <div id="player">
                    <h3>Player</h3>
                        <img id="playerImg" class="choice-img" src="" alt="player choice">
                </div>

                    <h3 id="vs">VS</h3>

                <div id="computer">
                    <h3>Computer</h3>
                        <img id="computerImg" class="choice-img" src="" alt="computer choice">
                </div>
            </div>

        <div id="scoreboard">
            <h2>Scoreboard</h2>
            <p>Player: <span id="playerScore">0</span></p>
            <p>Computer: <span id="computerScore">0</span></p>
        </div>


            <div class="choices">
                <button id="rock">Rock</button>
                <button id="paper">Paper</button>
                <button id="scissors">Scissors</button>
            </div>

            <button id="playAgain">Play Again</button>
    </div>

    <script src="R,S,P.js"></script>
</body>
</html>
